<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bataille Navale - Placement des Bateaux</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
</head>
<body>
    <div class="background-overlay"></div>

    <h1>⚓ Placez vos bateaux ⚓</h1>

    <div class="game-container">
        <!-- Grille du joueur -->
        <div class="grid-wrapper">
            <div class="numbers">
                <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>

            <div class="grid" id="player-grid">
                <!-- Cases générées dynamiquement par JavaScript -->
            </div>

            <div class="letters">
                <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
                <span>F</span><span>G</span><span>H</span><span>I</span><span>J</span>
            </div>
        </div>

        <!-- Zone des bateaux (côté droit) -->
        <div class="boats-container">
            <p>Glissez les bateaux sur la grille :</p>
            <div class="boat" id="boat-1" draggable="true" data-size="5"></div>
            <div class="boat" id="boat-2" draggable="true" data-size="4"></div>
            <div class="boat" id="boat-3" draggable="true" data-size="3"></div>
            <div class="boat" id="boat-4" draggable="true" data-size="3"></div>
            <div class="boat" id="boat-5" draggable="true" data-size="2"></div>
        </div>
    </div>

    <!-- Bouton pour valider le placement et sauvegarder -->
    <button id="validate-placement">✅ Valider le placement</button>
    <button id="start-game" disabled>🚀 Lancer la partie</button>
    <a href="/mode" class="back-button">⬅ Retour</a>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>

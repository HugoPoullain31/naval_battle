<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Joueur 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mode.css') }}">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="content">
        <h1>🎮 Joueur 2 - Rejoins la partie</h1>
        <form method="POST" action="/join">
            <input type="hidden" name="player_role" value="player2">
            <input type="hidden" name="game_id" value="{{ game_id }}">
            <label for="player_name">Entrez votre prénom :</label><br><br>
            <input type="text" name="player_name" required>
            <br><br>
            <button type="submit" class="mode-button">Rejoindre</button>
        </form>
        <br>
        <a href="/" class="back-button">⬅ Retour</a>
    </div>
</body>
</html>

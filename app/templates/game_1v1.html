<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - 1 VS 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mode.css') }}">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="content">
        <h1>👥 Mode 1 VS 1</h1>
        <p>Donne cette IP à ton adversaire : <strong>{{ ip }}:5000/game_1v1</strong></p>
        <form method="POST" action="/join">
            <label for="player_name">Entrez votre prénom :</label><br><br>
            <input type="text" name="player_name" required>
            <br><br>
            <button type="submit" class="mode-button">Rejoindre la partie</button>
        </form>
        <br>
        <a href="/" class="back-button">⬅ Retour</a>
    </div>
</body>
</html>
